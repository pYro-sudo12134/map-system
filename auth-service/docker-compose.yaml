services:
  postgres:
    image: postgres:16-alpine
    container_name: auth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ism_auth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - auth_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ism_auth"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - auth-net

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      AUTH_DB: ism_auth
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      AUTH_SERVICE_SCHEMA: public
      JWT_SECRET: a-string-secret-at-least-256-bits-long
      JWT_EXPIRATION: 86400000
      JWT_REFRESH_EXPIRATION: 604800000
      LOGGING_LEVEL_AUTH: INFO
      SPRING_SECURITY_LEVEL: INFO
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - auth-net

volumes:
  auth_pg_data:
    name: auth_pg_data

networks:
  auth-net:
    name: auth-net
    driver: bridge