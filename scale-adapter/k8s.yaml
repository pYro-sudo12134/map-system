apiVersion: v1
kind: ServiceAccount
metadata:
  name: scale-adapter
  namespace: ism-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: scale-adapter
  namespace: openfaas-fn
rules:
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: scale-adapter
  namespace: openfaas-fn
subjects:
  - kind: ServiceAccount
    name: scale-adapter
    namespace: ism-system
roleRef:
  kind: Role
  name: scale-adapter
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scale-adapter
  namespace: ism-system
spec:
  replicas: 1
  selector:
    matchLabels: { app: scale-adapter }
  template:
    metadata:
      labels: { app: scale-adapter }
    spec:
      serviceAccountName: scale-adapter
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: adapter
          image: pyrodocker1/scale-adapter:0.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: TARGET_NAMESPACE
              value: openfaas-fn
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
          resources:
            requests: { memory: "64Mi", cpu: "50m" }
            limits: { memory: "128Mi", cpu: "200m" }
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: scale-adapter
  namespace: ism-system
spec:
  selector: { app: scale-adapter }
  ports:
    - name: http
      port: 8080
      targetPort: 8080