apiVersion: v1
kind: Namespace
metadata:
  name: kpack-system
  labels:
    name: kpack-system
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline

---
apiVersion: kpack.io/v1alpha2
kind: ClusterStack
metadata:
  name: base
spec:
  id: "io.buildpacks.stacks.jammy"
  buildImage:
    image: "paketobuildpacks/build-jammy-base"
  runImage:
    image: "paketobuildpacks/run-jammy-base"

---
apiVersion: kpack.io/v1alpha2
kind: ClusterStore
metadata:
  name: default
spec:
  sources:
    - image: gcr.io/paketo-buildpacks/builder:base
    - image: gcr.io/paketo-buildpacks/nodejs
    - image: gcr.io/paketo-buildpacks/java
    - image: gcr.io/paketo-buildpacks/python
    - image: gcr.io/paketo-buildpacks/go

---
apiVersion: v1
kind: Secret
metadata:
  name: dockerhub-credentials
  namespace: kpack-system
  annotations:
    kpack.io/docker: https://hub.docker.com/ # http://harbor.harbor.svc.cluster.local
type: kubernetes.io/basic-auth
stringData:
  username: pyrodocker1
  password: pyrodocker1 # I am not going to insert it

---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: dockerhub-credentials
  namespace: kpack-system
  annotations:
    sealedsecrets.bitnami.com/managed: "true"
spec:
  encryptedData:
    username: 
    password: 
  template:
    metadata:
      annotations:
        kpack.io/docker: https://hub.docker.com/ # http://harbor.harbor.svc.cluster.local
    type: kubernetes.io/basic-auth

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kpack-service-account
  namespace: kpack-system
secrets:
  - name: dockerhub-credentials

---
apiVersion: kpack.io/v1alpha2
kind: Builder
metadata:
  name: java-builder
  namespace: kpack-system
spec:
  tag: docker.io/pyrodocker1/java-builder # http://harbor.harbor.svc.cluster.local/java-builder
  serviceAccount: kpack-service-account
  stack:
    name: base
    kind: ClusterStack
  store:
    name: default
    kind: ClusterStore
  order:
    - group:
        - id: paketo-buildpacks/java
        - id: paketo-buildpacks/spring-boot

---
apiVersion: kpack.io/v1alpha2
kind: Builder
metadata:
  name: go-builder
  namespace: kpack-system
spec:
  tag: docker.io/pyrodocker1/go-builder # http://harbor.harbor.svc.cluster.local/go-builder
  serviceAccount: kpack-service-account
  stack:
    name: base
    kind: ClusterStack
  store:
    name: default
    kind: ClusterStore
  order:
    - group:
        - id: paketo-buildpacks/go
        - id: paketo-buildpacks/procfile

---
apiVersion: kpack.io/v1alpha2
kind: Builder
metadata:
  name: python-builder
  namespace: kpack-system
spec:
  tag: docker.io/pyrodocker1/python-builder # http://harbor.harbor.svc.cluster.local/python-builder
  serviceAccount: kpack-service-account
  stack:
    name: base
    kind: ClusterStack
  store:
    name: default
    kind: ClusterStore
  order:
    - group:
        - id: paketo-buildpacks/python

---
apiVersion: kpack.io/v1alpha2
kind: Image
metadata:
  name: auth-service
  namespace: kpack-system
spec:
  tag: docker.io/pyrodocker1/auth-service # http://harbor.harbor.svc.cluster.local/auth-service
  serviceAccount: kpack-service-account
  builder:
    name: java-builder
    kind: Builder
  source:
    git:
      url: https://github.com/pYro-sudo12134/map-system
      revision: master
    subPath: auth-service
  build:
    env:
      - name: BP_JVM_VERSION
        value: "21"

---
apiVersion: kpack.io/v1alpha2
kind: Image
metadata:
  name: map-router
  namespace: kpack-system
spec:
  tag: docker.io/pyrodocker1/map-router # http://harbor.harbor.svc.cluster.local/map-router
  serviceAccount: kpack-service-account
  builder:
    name: java-builder
    kind: Builder
  source:
    git:
      url: https://github.com/pYro-sudo12134/map-system
      revision: master
    subPath: map-router
  build:
    env:
      - name: BP_JVM_VERSION
        value: "21"

---
apiVersion: kpack.io/v1alpha2
kind: Image
metadata:
  name: map-operator
  namespace: kpack-system
spec:
  tag: docker.io/pyrodocker1/map-operator # http://harbor.harbor.svc.cluster.local/map-operator
  serviceAccount: kpack-service-account
  builder:
    name: go-builder
    kind: Builder
  source:
    git:
      url: https://github.com/pYro-sudo12134/map-system
      revision: master
    subPath: map-operator
  build:
    env:
      - name: BP_GO_TARGETS
        value: "./cmd/manager"

---
apiVersion: kpack.io/v1alpha2
kind: Image
metadata:
  name: sync-operator
  namespace: kpack-system
spec:
  tag: docker.io/pyrodocker1/sync-operator # http://harbor.harbor.svc.cluster.local/sync-operator
  serviceAccount: kpack-service-account
  builder:
    name: go-builder
    kind: Builder
  source:
    git:
      url: https://github.com/pYro-sudo12134/map-system
      revision: master
    subPath: sync-operator
  build:
    env:
      - name: BP_GO_TARGETS
        value: "./cmd/manager"

---
apiVersion: kpack.io/v1alpha2
kind: Image
metadata:
  name: rag-agent
  namespace: kpack-system
spec:
  tag: docker.io/pyrodocker1/rag-agent # http://harbor.harbor.svc.cluster.local/rag-agent
  serviceAccount: kpack-service-account
  builder:
    name: python-builder
    kind: Builder
  source:
    git:
      url: https://github.com/pYro-sudo12134/map-system
      revision: master
    subPath: rag-agent
  build:
    env:
      - name: BP_PIP_REQUIREMENTS_FILE
        value: "requirements.txt"
      - name: BP_PYTHON_VERSION
        value: "3.11"

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-kpack-reader
  namespace: argocd

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kpack-image-reader
rules:
  - apiGroups: ["kpack.io"]
    resources: ["images"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argocd-kpack-reader-binding
subjects:
  - kind: ServiceAccount
    name: argocd-kpack-reader
    namespace: argocd
roleRef:
  kind: ClusterRole
  name: kpack-image-reader
  apiGroup: rbac.authorization.k8s.io

#  kubectl apply -f https://github.com/pivotal/kpack/releases/download/v0.4.1/release-0.4.1.yaml
