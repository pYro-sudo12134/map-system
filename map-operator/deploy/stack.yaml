version: 1.0

provider:
  name: openfaas
  gateway: http://localhost:8089

functions:
  faas-m:
    lang: dockerfile
    handler: ../../map-faas
    image: pyrodocker1/faas-m:latest
#    serviceAccount: map-operator-sa
    platform: linux/amd64
    environment:
      NEO4J_URI: bolt://host.docker.internal:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: testpass
      SQS_GO_QUEUE_URL: http://host.docker.internal:4566/000000000000/SQS_GO
      SQS_VISIBILITY_TIMEOUT: "300"
      SNS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:ISM_Topic
      AWS_ENDPOINT_URL: http://host.docker.internal:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      OPENSEARCH_URL: http://host.docker.internal:9200
      OPENSEARCH_USER: admin
      OPENSEARCH_PASSWORD: admin
      OPENSEARCH_NODES_INDEX: nodes
    labels:
      com.openfaas.scale.min: 2
      com.openfaas.scale.max: 5
      faas_function: faas-m
    annotations:
      prometheus.io.scrape: "true"
    limits:
      memory: 256Mi
    requests:
      memory: 128Mi

# faas-cli up -f stack.yaml