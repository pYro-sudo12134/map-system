apiVersion: batch/v1
kind: Job
metadata:
  name: terraform-init
  namespace: ism-mq
#  annotations:
#    "helm.sh/hook": post-install,post-upgrade
#    "helm.sh/hook-weight": "5"
#    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: terraform-init
    spec:
      serviceAccountName: terraform-sa
      restartPolicy: Never
      containers:
        - name: terraform
          image: hashicorp/terraform:1.15.5
          command:
            - /bin/sh
            - -c
            - |
              set -e
              
              cp /tf-config/* .
              terraform init
              
              terraform plan -var="aws_access_key_id=${AWS_ACCESS_KEY_ID}" \
                             -var="aws_secret_access_key=${AWS_SECRET_ACCESS_KEY}" \
                             -out=plan.tfplan
              
              terraform apply -auto-approve plan.tfplan
              
              terraform output -json > /terraform-outputs/outputs.json
          env:
            - name: TF_LOG
              value: "INFO"
            - name: TF_IN_AUTOMATION
              value: "true"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: localstack-secret
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: localstack-secret
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_DEFAULT_REGION
              value: "us-east-1"
          volumeMounts:
            - name: tf-config
              mountPath: /tf-config
            - name: terraform-outputs
              mountPath: /terraform-outputs
          resources:
            requests:
              memory: "512Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "200m"
      volumes:
        - name: tf-config
          configMap:
            name: localstack-tf-init
        - name: terraform-outputs
          emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: terraform-sa
  namespace: ism-mq
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: terraform-role
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: terraform-role-binding
subjects:
  - kind: ServiceAccount
    name: terraform-sa
    namespace: ism-mq
roleRef:
  kind: ClusterRole
  name: terraform-role
  apiGroup: rbac.authorization.k8s.io