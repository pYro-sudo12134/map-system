apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ism-mq

resources:
  - configmap-cf.yaml
  - configmap-tf.yaml
  - pdb.yaml
  - pvc.yaml
  - service.yaml
  - statefulset.yaml
  - tf-init-job.yaml

generatorOptions:
  disableNameSuffixHash: true

commonLabels:
  app: localstack
  component: mq