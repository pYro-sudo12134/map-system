apiVersion: v1
kind: ConfigMap
metadata:
  name: localstack-tf-init
  namespace: ism-mq
data:
  main.tf: |
    terraform {
      required_providers {
        aws = {
          source  = "hashicorp/aws"
          version = "~> 5.0"
        }
        random = {
          source  = "hashicorp/random"
          version = "~> 3.0"
        }
      }
    }

    provider "aws" {
      region                      = var.aws_region
      access_key                  = var.aws_access_key_id
      secret_key                  = var.aws_secret_access_key
      skip_credentials_validation = true
      skip_metadata_api_check     = true
      skip_requesting_account_id  = true
      s3_use_path_style           = true

      endpoints {
        s3          = var.endpoint_url
        sqs         = var.endpoint_url
        sns         = var.endpoint_url
        lambda      = var.endpoint_url
        iam         = var.endpoint_url
        transcribe  = var.endpoint_url
        sts         = var.endpoint_url
        cloudformation = var.endpoint_url
      }
    }

    resource "aws_s3_bucket" "voice_records" {
      bucket        = "voice-records"
      force_destroy = true
    }

    resource "aws_s3_bucket_versioning" "voice_records" {
      bucket = aws_s3_bucket.voice_records.id
      versioning_configuration {
        status = "Enabled"
      }
    }

    resource "aws_sqs_queue" "dlq" {
      name                      = "DLQ"
      message_retention_seconds = 1209600
    }

    resource "aws_sqs_queue" "sqs_rag" {
      name = "SQS_RAG"
      
      visibility_timeout_seconds = 60
      message_retention_seconds  = 345600
      
      redrive_policy = jsonencode({
        deadLetterTargetArn = aws_sqs_queue.dlq.arn
        maxReceiveCount     = 3
      })
    }

    resource "aws_sqs_queue" "sqs_go" {
      name = "SQS_GO"
      
      visibility_timeout_seconds = 60
      message_retention_seconds  = 345600
      
      redrive_policy = jsonencode({
        deadLetterTargetArn = aws_sqs_queue.dlq.arn
        maxReceiveCount     = 3
      })
    }

    resource "aws_sqs_queue" "sqs_results" {
      name = "SQS_RESULTS"
      
      visibility_timeout_seconds = 60
      message_retention_seconds  = 345600
      
      redrive_policy = jsonencode({
        deadLetterTargetArn = aws_sqs_queue.dlq.arn
        maxReceiveCount     = 3
      })
    }

    resource "aws_sqs_queue" "sqs_sync" {
      name = "SQS_SYNC"
      
      visibility_timeout_seconds = 120
      message_retention_seconds  = 345600
      
      redrive_policy = jsonencode({
        deadLetterTargetArn = aws_sqs_queue.dlq.arn
        maxReceiveCount     = 3
      })
    }

    resource "aws_sns_topic" "ism_topic" {
      name = "ISM_Topic"
    }

    # Подписка SQS на SNS
    resource "aws_sns_topic_subscription" "sqs_results_subscription" {
      topic_arn = aws_sns_topic.ism_topic.arn
      protocol  = "sqs"
      endpoint  = aws_sqs_queue.sqs_results.arn
      
      raw_message_delivery = true
    }

    resource "aws_sqs_queue_policy" "sqs_results_policy" {
      queue_url = aws_sqs_queue.sqs_results.id
      
      policy = jsonencode({
        Version = "2012-10-17"
        Statement = [
          {
            Effect = "Allow"
            Principal = {
              Service = "sns.amazonaws.com"
            }
            Action = "sqs:SendMessage"
            Resource = aws_sqs_queue.sqs_results.arn
            Condition = {
              ArnEquals = {
                "aws:SourceArn" = aws_sns_topic.ism_topic.arn
              }
            }
          }
        ]
      })
    }

    output "s3_bucket" {
      value = aws_s3_bucket.voice_records.bucket
    }

    output "sqs_rag_url" {
      value = aws_sqs_queue.sqs_rag.url
    }

    output "sqs_go_url" {
      value = aws_sqs_queue.sqs_go.url
    }

    output "sqs_results_url" {
      value = aws_sqs_queue.sqs_results.url
    }

    output "sqs_sync_url" {
      value = aws_sqs_queue.sqs_sync.url
    }

    output "dlq_url" {
      value = aws_sqs_queue.dlq.url
    }

    output "sns_topic_arn" {
      value = aws_sns_topic.ism_topic.arn
    }

  variables.tf: |
    variable "aws_region" {
      description = "AWS region"
      type        = string
      default     = "us-east-1"
    }

    variable "aws_access_key_id" {
      description = "AWS access key"
      type        = string
      sensitive   = true
    }

    variable "aws_secret_access_key" {
      description = "AWS secret key"
      type        = string
      sensitive   = true
    }

    variable "endpoint_url" {
      description = "LocalStack endpoint URL"
      type        = string
      default     = "http://localstack.ism-mq.svc.cluster.local:4566"
    }

  terraform.tfvars: |
    aws_region = "us-east-1"
    endpoint_url = "http://localstack.ism-mq.svc.cluster.local:4566"
