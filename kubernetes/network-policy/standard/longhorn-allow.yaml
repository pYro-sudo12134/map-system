apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: longhorn-api-access
  namespace: longhorn-system
spec:
  podSelector:
    matchLabels:
      app: longhorn-manager
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              component: apiserver
              provider: kubernetes
      ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP