apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: block-exfiltration
spec:
  kprobes:
    - call: "do_execve"
      syscall: true
      args:
        - index: 0
          type: "string"
        - index: 1
          type: "string"
      selectors:
        - matchNamespaces:
            - namespace: Pid
              operator: NotIn
              values: ["host_ns"]
          matchArgs:
            - index: 0
              operator: "Postfix"
              values:
                - "/curl"
                - "/wget"
            - index: 1
              operator: "SubString"
              values:
                - "-F"
                - "--data"
                - "-d"
                - "http://"
                - "https://"
          matchActions:
            - action: Sigkill
            - action: Post