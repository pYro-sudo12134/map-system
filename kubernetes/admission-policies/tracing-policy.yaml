apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: block-java-commands
spec:
  kprobes:
    - call: "execve"
      syscall: true
      args:
        - index: 0
          type: "string"
      selectors:
        - matchBinaries:
            - operator: "Postfix"
              values:
                - "java"
                - "javac"
                - "javap"
                - "jar"
                - "jdb"
                - "jshell"
          matchActions:
            - action: Sigkill
            - action: Post
---
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: block-python-dangerous
spec:
  kprobes:
    - call: "do_execve"
      syscall: true
      args:
        - index: 0
          type: "string"
        - index: 1
          type: "string"
      selectors:
        - matchNamespaces:
            - namespace: Pid
              operator: NotIn
              values: ["host_ns"]
          matchArgs:
            - index: 0
              operator: "Postfix"
              values:
                - "/python"
                - "/python3"
            - index: 1
              operator: "SubString"
              values:
                - "import os"
                - "import subprocess"
                - "__import__"
                - "exec("
                - "eval("
                - "os.system"
                - "subprocess.call"
                - "subprocess.Popen"
                - "socket."
          matchActions:
            - action: Sigkill
            - action: Post
---
