- macro: container
  condition: (container.id != "")

- rule: Java Decompilation Attempt
  desc: Detect javap command used to decompile .class files
  condition: >
    evt.type = execve and 
    container and
    (proc.name = "javap" or proc.cmdline contains "javap")
  output: >
    Java decompilation attempted in container
    (pod=%k8s.pod.name namespace=%k8s.ns.name 
    user=%user.name command=%proc.cmdline)
  priority: CRITICAL
  tags: [java, decompile, mitre_TA0008]

- rule: Java Compilation Attempt
  desc: Detect javac compilation in containers
  condition: >
    evt.type = execve and 
    container and
    (proc.name = "javac" or proc.cmdline contains "javac")
  output: >
    Java compilation attempted in container
    (pod=%k8s.pod.name namespace=%k8s.ns.name 
    command=%proc.cmdline)
  priority: CRITICAL
  tags: [java, compile]

- rule: JAR Extraction Attempt
  desc: Detect jar command extracting files
  condition: >
    evt.type = execve and 
    container and
    proc.name = "jar" and 
    (proc.cmdline contains "xf" or proc.cmdline contains "xvf")
  output: >
    JAR extraction attempted in container
    (pod=%k8s.pod.name namespace=%k8s.ns.name 
    args=%proc.cmdline)
  priority: CRITICAL
  tags: [java, extraction]

- rule: Python Code Injection
  desc: Detect dangerous Python commands
  condition: >
    evt.type = execve and 
    container and
    proc.name in (python, python3) and
    (proc.cmdline contains "-c" and 
     (proc.cmdline contains "import os" or 
      proc.cmdline contains "import subprocess" or
      proc.cmdline contains "__import__" or
      proc.cmdline contains "exec("))
  output: >
    Python code injection detected
    (pod=%k8s.pod.name namespace=%k8s.ns.name 
    command=%proc.cmdline)
  priority: CRITICAL
  tags: [python, injection]

- rule: Pip Install
  desc: Detect pip install in containers
  condition: >
    evt.type = execve and 
    container and
    proc.name in (pip, pip3) and
    proc.cmdline contains "install"
  output: >
    Pip install attempted in container
    (pod=%k8s.pod.name namespace=%k8s.ns.name 
    package=%proc.cmdline)
  priority: CRITICAL
  tags: [python, supply_chain]

- rule: Go Build in Container
  desc: Detect go build/run in containers
  condition: >
    evt.type = execve and 
    container and
    proc.name = "go" and
    (proc.cmdline contains "build" or 
     proc.cmdline contains "run")
  output: >
    Go build/run detected in container
    (pod=%k8s.pod.name namespace=%k8s.ns.name 
    command=%proc.cmdline)
  priority: CRITICAL
  tags: [golang, compilation]