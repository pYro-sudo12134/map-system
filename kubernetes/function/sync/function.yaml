apiVersion: openfaas.com/v1
kind: Function
metadata:
  name: faas-s
  namespace: openfaas-fn
  labels:
    app: faas-s
    faas_function: faas-s
    com.openfaas.scale.min: "2"
    com.openfaas.scale.max: "20"
    com.openfaas.scale.zero: "false"
    com.openfaas.scale.zero-duration: "5m"
  annotations:
    prometheus.io.scrape: "true"
    prometheus.io.port: "8080"
    prometheus.io/path: "/metrics"
spec:
  name: faas-s
  image: pyrodocker1/faas-s:0.1
  serviceAccount: sync-operator-sa
  secrets:
    - faas-s-secrets
  environment:
    NEO4J_URI: "bolt://neo4j.database.svc.cluster.local:7687"
    NEO4J_USER: "neo4j"
    OPENSEARCH_URL: "http://opensearch.database.svc.cluster.local:9200"
    OPENSEARCH_USER: "admin"
    OPENSEARCH_NODES_INDEX: "nodes"
    OPENSEARCH_EDGES_INDEX: "edges"
    SQS_SYNC_RESULTS_URL: "http://localstack.ism-mq.svc.cluster.local:4566/000000000000/SQS_SYNC_RESULTS"
    AWS_ENDPOINT_URL: "http://localstack.ism-mq.svc.cluster.local:4566"
  limits:
    cpu: "200m"
    memory: "256Mi"
  requests:
    cpu: "10m"
    memory: "128Mi"