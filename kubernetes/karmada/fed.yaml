apiVersion: policy.karmada.io/v1alpha1
kind: PropagationPolicy
metadata:
  name: ism-system-propagation
  namespace: ism-system
spec:
  propagateDeps: true
  resourceSelectors:
    - apiVersion: apps/v1
      kind: Deployment
      labelSelector:
        matchExpressions:
          - key: app
            operator: In
            values: [auth-service, map-operator, sync-operator, map-router]
    - apiVersion: v1
      kind: Service
      labelSelector:
        matchExpressions:
          - key: app
            operator: In
            values: [auth-service, map-operator, sync-operator, map-router]
    - apiVersion: v1
      kind: ConfigMap
      labelSelector:
        matchExpressions:
          - key: app
            operator: In
            values: [auth-service, map-operator, sync-operator, map-router]
    - apiVersion: v1
      kind: Secret
      labelSelector:
        matchExpressions:
          - key: app
            operator: In
            values: [auth-service, map-operator, sync-operator, map-router]
  placement:
    clusterAffinity:
      clusterNames: [member1, member2]
    replicaScheduling:
      replicaDivisionPreference: Weighted
      replicaSchedulingType: Divided
      weightPreference:
        staticWeightList:
          - targetCluster: { clusterNames: [member1] }
            weight: 1
          - targetCluster: { clusterNames: [member2] }
            weight: 1
---
apiVersion: policy.karmada.io/v1alpha1
kind: ClusterPropagationPolicy
metadata:
  name: cert-manager-issuers
spec:
  resourceSelectors:
    - apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      name: letsencrypt-prod
    - apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      name: letsencrypt-staging
  placement:
    clusterAffinity:
      clusterNames: [member1, member2]
    replicaScheduling:
      replicaSchedulingType: Duplicated
---
apiVersion: policy.karmada.io/v1alpha1
kind: PropagationPolicy
metadata:
  name: ism-cert
  namespace: ingress
spec:
  propagateDeps: true
  resourceSelectors:
    - apiVersion: cert-manager.io/v1
      kind: Certificate
      name: ism-cert
    - apiVersion: networking.k8s.io/v1
      kind: Ingress
      name: ism-ingress-cilium
    - apiVersion: v1
      kind: Secret
      name: ism-tls-secret
  placement:
    clusterAffinity:
      clusterNames: [member1, member2]
    replicaScheduling:
      replicaSchedulingType: Duplicated
---
apiVersion: policy.karmada.io/v1alpha1
kind: ClusterPropagationPolicy
metadata:
  name: generic
spec:
  namespaceSelector:
    matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: In
        values: [ism-system, openfaas, openfaas-fn, monitoring, ingress, argocd]
  resourceSelectors:
    - apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
    - apiVersion: v1
      kind: ServiceAccount
    - apiVersion: cilium.io/v2
      kind: CiliumClusterwideEnvoyConfig
      name: ingress-ratelimit
    - apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
    - apiVersion: policy/v1
      kind: PodDisruptionBudget
    - apiVersion: v1
      kind: ConfigMap
    - apiVersion: v1
      kind: Secret
    - apiVersion: bitnami.com/v1alpha1
      kind: SealedSecret 
    - apiVersion: monitoring.coreos.com/v1
      kind: PrometheusRule
    - apiVersion: monitoring.coreos.com/v1
      kind: ServiceMonitor
    - apiVersion: openfaas.com/v1
      kind: Function
    - apiVersion: argoproj.io/v1alpha1
      kind: Application
  placement:
    clusterAffinity:
      clusterNames: [member1, member2]
    replicaScheduling:
      replicaSchedulingType: Duplicated
---
apiVersion: operator.karmada.io/v1alpha1
kind: Karmada
metadata:
  name: karmada-replica
  namespace: karmada-system
spec:
  components:
    etcd:
      local: { }
    karmadaAPIServer:
      replicas: 2
    karmadaControllerManager:
      replicas: 2

